name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      # Tags, not just the tip: `check-release-versions.py` compares each
      # changed widget against the one in the last release tag, and a shallow
      # checkout has no tags to compare against — the check would pass by
      # skipping rather than by being satisfied.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned, not `latest-stable`. A floating toolchain silently changes the
      # SDK under the build: that is how a `-strict-concurrency=complete` error
      # (an unannotated `mach_task_self_`) reached CI while passing locally on a
      # newer SDK. When the runner image drops this version the job fails
      # loudly, which is the point — bumping it should be a visible commit.
      #
      # Kept near the toolchain releases are actually built with, which is not
      # the same as keeping it still. This sat at macos-14 + Xcode 16.2 while
      # releases were cut locally on Xcode 27 / Swift 6.4 — three majors apart,
      # so CI was proving something about a toolchain nobody ships with. Worse,
      # 16.2 is no longer on the current image at all, so the old pin was one
      # runner retirement away from failing outright. 26.6 is the newest the
      # image carries; raise it when the image carries 27.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build

      - name: Strict concurrency (core)
        run: swift build --target MenubucketCore -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Check release version references
        run: python3 scripts/check-release-versions.py

      - name: Build widget pages
        run: python3 scripts/build-widget-pages.py "$(mktemp -d)"

      - name: Validate JSON schemas
        run: |
          for f in schema/*.json registry/index.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('ok', '$f')"
          done

      - name: Validate bundled widgets
        run: |
          swift build --product barshelf
          swift build --product bsf
          BARSHELF_CLI="$(swift build --product barshelf --show-bin-path)/barshelf"
          for w in widgets/*/; do
            [ -f "$w/widget.json" ] && "$BARSHELF_CLI" validate "$w"
          done
