name: tap-bump

# Keep Open330/homebrew-tap's barshelf cask and barshelf-cli formula pointing
# at the newest published release.
#
# It exists because they did not. Both sat at 0.1.3 while the project shipped
# 0.3.0, since the release script bumped a *second* copy of the cask that used
# to live in this repo. A user who installed from the tap was told by the app
# to run `brew upgrade --cask barshelf` and told by brew that they were already
# current — no update path at all. The duplicate is gone; this keeps the
# remaining copy honest.
#
# On `release: published` rather than tag push: this project's releases are cut
# by hand with `gh release create`, which runs under a human's credentials and
# so does raise the event. Assets exist by then, too — a cask pointing at a 404
# is worse than one that is merely stale.
#
# Requires the `TAP_GITHUB_TOKEN` repo secret: a fine-grained PAT with Contents
# read/write on Open330/homebrew-tap (the default GITHUB_TOKEN cannot push to a
# sibling repo). Without it the job exits early with a notice rather than
# failing, so a release stays green and the tap is bumped by hand —
# `verify-release.sh` is what catches it if nobody does.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sync the tap to (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: bump cask and formula
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: ref
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "::error::no tag to sync the tap to" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Read the published checksums
        id: sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ref.outputs.tag }}"
          version="${{ steps.ref.outputs.version }}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          # SHA256SUMS lines are "<sha256>  ./<file>", written by release.sh.
          sum_for() {
            awk -v want="$1" '$2 == "./" want { print $1; found=1 } END { exit !found }' SHA256SUMS
          }
          {
            echo "app=$(sum_for "BarShelf-${version}-arm64.zip")"
            echo "cli=$(sum_for "barshelf-cli-${version}-arm64.tar.gz")"
          } >> "$GITHUB_OUTPUT"

      - name: Render and push
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.ref.outputs.version }}
          APP_SHA: ${{ steps.sums.outputs.app }}
          CLI_SHA: ${{ steps.sums.outputs.cli }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::notice::TAP_GITHUB_TOKEN is not configured — skipping the tap bump. Update Open330/homebrew-tap by hand; scripts/verify-release.sh will fail until you do."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/Open330/homebrew-tap.git" tap
          cat > tap/Casks/barshelf.rb <<EOF
          cask "barshelf" do
            version "${VERSION}"
            sha256 "${APP_SHA}"

            url "https://github.com/Open330/barshelf/releases/download/v#{version}/BarShelf-#{version}-arm64.zip"
            name "BarShelf"
            desc "Scriptable menu bar widget platform"
            homepage "https://github.com/Open330/barshelf"

            # Deliberately no auto_updates. BarShelf *can* replace itself, but it
            # detects a Homebrew-installed copy and refuses, pointing at
            # 'brew upgrade --cask barshelf' instead. Declaring auto_updates would
            # make 'brew upgrade' skip this cask, and the two together leave no
            # update path at all.
            depends_on arch: :arm64
            depends_on macos: :ventura

            app "BarShelf.app"

            # A menu bar app is almost always running, and replacing a live bundle
            # leaves the old build in memory until the user notices.
            uninstall quit: "com.barshelf.app"

            # Everything the app owns. The widgets directory is the one that
            # matters: losing it costs the user their installed widgets, so it is
            # zap-only and never touched by a plain uninstall.
            zap trash: [
              "~/Library/Application Support/barshelf",
              "~/Library/Caches/BarShelf",
              "~/Library/Caches/com.barshelf.app",
              "~/Library/HTTPStorages/com.barshelf.app",
              "~/Library/Logs/BarShelf",
              "~/Library/Preferences/com.barshelf.app.plist",
              "~/Library/Saved Application State/com.barshelf.app.savedState",
            ]
          end
          EOF
          cat > tap/Formula/barshelf-cli.rb <<EOF
          class BarshelfCli < Formula
            desc "Widget developer CLI for the BarShelf macOS menu bar app"
            homepage "https://github.com/Open330/barshelf"
            version "${VERSION}"
            url "https://github.com/Open330/barshelf/releases/download/v#{version}/barshelf-cli-#{version}-arm64.tar.gz"
            sha256 "${CLI_SHA}"
            license "MIT"

            # Upstream ships Apple Silicon binaries only.
            depends_on arch: :arm64
            depends_on :macos

            def install
              bin.install "barshelf"
              bin.install "bsf"
            end

            # No backticks or unescaped dollar signs in here: this file is written
            # from an unquoted shell heredoc, which would run the one as a command
            # and expand the other.
            def caveats
              <<~CAVEATS
                'barshelf upgrade' updates the app and the CLI together, but it
                detects a Homebrew-installed CLI and refuses to replace it —
                writing into the Cellar would leave brew holding the version it
                installed, and the next upgrade would revert yours. Use
                'brew upgrade barshelf-cli' instead.
              CAVEATS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/barshelf --version")
              assert_match version.to_s, shell_output("#{bin}/bsf --version")
            end
          end
          EOF
          cd tap
          git add -- Casks/barshelf.rb Formula/barshelf-cli.rb
          if [ -z "$(git status --porcelain)" ]; then
            echo "tap already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "barshelf ${VERSION}"
          git push
